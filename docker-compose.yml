services:
  postgres:
    image: postgres:16-alpine
    container_name: beauty-studio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-beautystudio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-beautystudio_secret}
      POSTGRES_DB: ${POSTGRES_DB:-beautystudio_db}
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-beautystudio} -d $${POSTGRES_DB:-beautystudio_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: beauty-studio-mailpit
    restart: unless-stopped
    ports:
      - "11025:1025" # SMTP
      - "18025:8025" # Web UI

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: beauty-studio-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-beautystudio}:${POSTGRES_PASSWORD:-beautystudio_secret}@postgres:5432/${POSTGRES_DB:-beautystudio_db}?schema=public
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      PUBLIC_WEB_ORIGIN: ${PUBLIC_WEB_ORIGIN:-http://localhost:17173}
      TZ: UTC
    ports:
      - "13000:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/services', { signal: AbortSignal.timeout(2000) }).then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 3s
      timeout: 3s
      start_period: 20s
      retries: 10
    volumes:
      - ./server:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
    depends_on:
      server:
        condition: service_healthy
    environment:
      VITE_HMR_CLIENT_PORT: "17173"
    ports:
      - "17173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata:

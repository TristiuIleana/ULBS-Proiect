<!DOCTYPE html>
<html lang="ro" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Programările mele — Beauty Studio</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap">
  <style>
    :root {
      color-scheme: light;
      --background: #FAF7F2;
      --card: #FFFFFF;
      --subtle: #F4EFEA;
      --hover: #EFE9E2;
      --text: #2B2523;
      --secondary: #615651;
      --border: #D5CBC0;
      --primary: #C48B71;
      --success: #4E7A5D;
      --success-bg: #EDF4EF;
      --warning-bg: #FAF2E4;
      --error: #B84A39;
    }

    [data-theme="dark"] {
      color-scheme: dark;
      --background: #1A1716;
      --card: #241F1D;
      --subtle: #2E2825;
      --hover: #3A332F;
      --text: #F5F2EB;
      --secondary: #C7BFB7;
      --border: #4D433E;
      --primary: #D49D85;
      --success: #6FA07F;
      --success-bg: #1E2D23;
      --warning-bg: #2E2415;
      --error: #D96B5A;
    }

    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--text);
      background: var(--background);
      font: 400 14px/1.5 "Plus Jakarta Sans", system-ui, sans-serif;
      overflow-wrap: anywhere;
    }
    header { background: var(--card); border-bottom: 1px solid var(--border); }
    .container { max-width: 1024px; margin: auto; padding: 24px; }
    .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .between { justify-content: space-between; gap: 16px; }
    h1, h2 { margin: 0; font-family: "Playfair Display", Georgia, serif; }
    h1 { font-size: 32px; line-height: 1.25; font-weight: 500; }
    h2 { font-size: 24px; line-height: 1.3; }
    .brand { font-size: 24px; }
    .muted { color: var(--secondary); }
    .badge {
      padding: 4px 8px;
      border-radius: 6px;
      background: var(--subtle);
      color: var(--text);
      font-size: 12px;
      font-weight: 700;
    }
    .badge[data-status="Finalizată"] { background: var(--success-bg); color: var(--success); }
    .badge[data-status="Neprezentare"] { background: var(--warning-bg); }
    button, input, select, .button {
      max-width: 100%;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--card);
      color: var(--text);
      font: inherit;
    }
    button, .button { cursor: pointer; font-weight: 600; text-decoration: none; }
    button:hover, .button:hover { background: var(--hover); }
    :focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
    .primary, .primary:hover { background: var(--primary); color: #2B2523; }
    .primary:hover { text-decoration: underline; }
    main > .between, #feedback { margin-bottom: 16px; }
    .card {
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--card);
      box-shadow: 0 6px 20px -4px rgba(43, 37, 35, 0.08);
    }
    .agenda { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
    .agenda article { display: grid; grid-template-columns: 128px minmax(0, 1fr) auto; gap: 16px; align-items: center; }
    .agenda p, #feedback { margin-top: 0; }
    .agenda p { margin-bottom: 0; }
    .service { font-weight: 700; }
    dialog { width: min(640px, calc(100% - 32px)); color: var(--text); max-height: calc(100% - 32px); }
    dialog::backdrop { background: rgba(43, 37, 35, 0.55); }
    dialog dl { margin: 16px 0; }
    dt { font-weight: 700; }
    dd { margin: 0 0 12px; }
    form { display: grid; gap: 12px; margin-top: 16px; }
    form label { display: grid; gap: 4px; }
    .times { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .error { color: var(--error); margin: 0; }
    @media (max-width: 640px) {
      .container { padding: 16px; }
      h1 { font-size: 26px; }
      h2 { font-size: 20px; }
      .agenda article { grid-template-columns: minmax(0, 1fr); gap: 8px; justify-items: start; }
    }
  </style>
</head>
<body>
  <header>
    <div class="container row between">
      <div class="row">
        <span class="brand">Beauty Studio</span>
        <span class="badge">Specialistă Make-up</span>
      </div>
      <div class="row">
        <button type="button" id="theme-toggle" aria-pressed="false">Mod întunecat</button>
        <a class="button" href="DS-adm-login.html?logout">Deconectare</a>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="row between">
      <div>
        <h1>Programările mele</h1>
        <span class="muted">Ana · Agenda demonstrativă</span>
      </div>
      <button class="primary" id="open-block" type="button">Blochează un interval</button>
    </div>
    <div class="row between">
      <label class="row" for="agenda-date">Data <input type="date" id="agenda-date" value="2026-11-21" required></label>
      <span class="muted">Program 09:00–19:00</span>
    </div>
    <p id="feedback" role="status"></p>
    <p class="card" id="empty" hidden>Nicio programare sau blocare pentru data selectată.</p>
    <ul class="agenda" id="agenda" aria-label="Agenda zilei"></ul>
  </main>

  <dialog class="card" id="details" aria-labelledby="details-title">
    <div class="row between">
      <h2 id="details-title">Detalii programare</h2>
      <button type="button" id="close-details">Închide</button>
    </div>
    <dl>
      <dt>Serviciu</dt><dd id="detail-service"></dd>
      <dt>Clientă</dt><dd id="detail-client"></dd>
      <dt>Telefon</dt><dd id="detail-phone"></dd>
      <dt>Observații</dt><dd id="detail-notes"></dd>
      <dt>Stare</dt><dd id="detail-status"></dd>
    </dl>
    <div class="row" id="status-actions">
      <button type="button" class="primary" data-status="Finalizată">Finalizată</button>
      <button type="button" data-status="Neprezentare">Neprezentare</button>
    </div>
  </dialog>

  <dialog class="card" id="block-dialog" aria-labelledby="block-title">
    <h2 id="block-title">Blochează un interval</h2>
    <form id="block-form">
      <label>Motiv
        <select id="block-kind"><option>Pauză</option><option>Concediu</option></select>
      </label>
      <label>Data <input id="block-date" type="date" required></label>
      <div class="times">
        <label>De la <input id="block-start" type="time" min="09:00" max="19:00" required></label>
        <label>Până la <input id="block-end" type="time" min="09:00" max="19:00" required></label>
      </div>
      <p class="error" id="block-error" role="alert" hidden></p>
      <div class="row">
        <button class="primary" type="submit">Salvează blocajul</button>
        <button type="button" id="close-block">Renunță</button>
      </div>
    </form>
  </dialog>

  <template id="entry-template">
    <li>
      <article class="card">
        <p class="time"></p>
        <div><p class="service"></p><p class="client muted"></p></div>
        <div class="row">
          <span class="badge"></span>
          <button class="details-button" type="button">Detalii</button>
        </div>
      </article>
    </li>
  </template>

  <script>
    const appointments = [
      { date: '2026-11-21', start: '09:00', end: '10:15', service: 'Make-up ocazie (fără gene)', client: 'Clientă demo 1', phone: '0700 000 001', notes: 'Machiaj de zi în nuanțe neutre.', status: 'Confirmată' },
      { date: '2026-11-21', start: '11:00', end: '13:00', service: 'Make-up mireasă', client: 'Clientă demo 2', phone: '0700 000 002', notes: 'Preferă un finisaj luminos și discret pentru fotografiile de la ceremonie.', status: 'Confirmată' },
      { date: '2026-11-21', start: '16:00', end: '17:30', service: 'Make-up ocazie (cu gene)', client: 'Clientă demo 3', phone: '0700 000 003', notes: 'Machiaj de seară.', status: 'Confirmată' }
    ];
    const blocks = [];
    const date = document.getElementById('agenda-date');
    const agenda = document.getElementById('agenda');
    const feedback = document.getElementById('feedback');
    const details = document.getElementById('details');
    const blockDialog = document.getElementById('block-dialog');
    const blockForm = document.getElementById('block-form');
    const blockDate = document.getElementById('block-date');
    const blockError = document.getElementById('block-error');
    const entryTemplate = document.getElementById('entry-template');
    let selectedAppointment;

    function renderAgenda() {
      const entries = [...appointments, ...blocks]
        .filter(entry => entry.date === date.value)
        .sort((first, second) => first.start.localeCompare(second.start));
      agenda.replaceChildren();
      document.getElementById('empty').hidden = entries.length > 0;

      for (const entry of entries) {
        const row = entryTemplate.content.cloneNode(true);
        row.querySelector('.time').textContent = entry.start + '–' + entry.end;
        row.querySelector('.service').textContent = entry.service;
        row.querySelector('.client').textContent = entry.client || '';
        const badge = row.querySelector('.badge');
        badge.dataset.status = entry.status;
        badge.textContent = entry.status;
        const button = row.querySelector('.details-button');
        button.hidden = !entry.client;
        if (entry.client) {
          button.setAttribute('aria-label', 'Detalii – ' + entry.client);
          button.addEventListener('click', () => openDetails(entry));
        }
        agenda.append(row);
      }
    }

    function openDetails(appointment) {
      selectedAppointment = appointment;
      document.getElementById('detail-service').textContent = appointment.service;
      document.getElementById('detail-client').textContent = appointment.client;
      document.getElementById('detail-phone').textContent = appointment.phone;
      document.getElementById('detail-notes').textContent = appointment.notes;
      document.getElementById('detail-status').textContent = appointment.status;
      details.showModal();
    }

    date.addEventListener('change', () => {
      feedback.textContent = '';
      renderAgenda();
    });
    document.getElementById('close-details').addEventListener('click', () => details.close());
    document.getElementById('status-actions').addEventListener('click', event => {
      const { status } = event.target.dataset;
      if (!status) return;
      selectedAppointment.status = status;
      details.close();
      renderAgenda();
      agenda.querySelector('[aria-label="Detalii – ' + selectedAppointment.client + '"]').focus();
      feedback.textContent = 'Stare actualizată: ' + status + '.';
    });
    document.getElementById('open-block').addEventListener('click', () => {
      blockForm.reset();
      blockDate.value = date.value;
      blockError.hidden = true;
      blockDialog.showModal();
    });
    document.getElementById('close-block').addEventListener('click', () => blockDialog.close());
    blockForm.addEventListener('submit', event => {
      event.preventDefault();
      const start = document.getElementById('block-start').value;
      const end = document.getElementById('block-end').value;
      const overlaps = [...appointments, ...blocks].some(entry =>
        entry.date === blockDate.value && start < entry.end && entry.start < end);
      if (start >= end || overlaps) {
        blockError.textContent = start >= end
          ? 'Ora de final trebuie să fie după ora de început.'
          : 'Intervalul se suprapune cu o programare sau cu un blocaj existent.';
        blockError.hidden = false;
        return;
      }
      blocks.push({
        date: blockDate.value, start, end,
        service: document.getElementById('block-kind').value, status: 'Blocat'
      });
      date.value = blockDate.value;
      blockDialog.close();
      renderAgenda();
      feedback.textContent = 'Interval blocat: ' + start + '–' + end + '.';
    });
    const themeToggle = document.getElementById('theme-toggle');
    themeToggle.addEventListener('click', () => {
      const dark = document.documentElement.dataset.theme !== 'dark';
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      themeToggle.setAttribute('aria-pressed', String(dark));
    });
    renderAgenda();
  </script>
</body>
</html>
